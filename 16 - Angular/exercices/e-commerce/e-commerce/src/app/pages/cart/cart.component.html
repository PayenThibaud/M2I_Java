<main class="p-6">
  <h1 class="text-3xl font-bold text-slate-800 mb-4 text-center">Mon Panier</h1>

  @if (cart.length === 0) {
  <p class="text-center text-slate-600">Votre panier est vide</p>
  } @else {
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (item of cart; track item.id) {
    <div class="border border-slate-200 rounded-lg shadow-md p-4 flex flex-col">
      <h2 class="text-lg font-semibold text-slate-800">{{ item.name }}</h2>
      <p class="text-slate-600 mb-2">Quantité: {{ item.quantity }}</p>
      <p class="text-lg font-bold text-slate-800">{{ item.price }}€</p>
      <p class="text-md font-bold text-slate-700">Total: {{ item.total }}€</p>
      <button
        class="mt-auto bg-slate-800 text-white rounded-lg py-2 hover:bg-slate-700"
        (click)="delete(item.id)"
      >
        Supprimer
      </button>
    </div>
    }
  </div>

  <div class="mt-6 p-4 bg-slate-100 rounded-lg shadow-md">
    <h2 class="text-xl font-semibold text-slate-800">
      Total de votre commande
    </h2>
    <p class="text-lg font-bold text-slate-800">Total général: {{ total }}€</p>
    <button
      class="mt-4 bg-slate-800 text-white rounded-lg py-2 hover:bg-slate-700 w-full"
    >
      Passer à la caisse
    </button>
  </div>
  }
</main>
