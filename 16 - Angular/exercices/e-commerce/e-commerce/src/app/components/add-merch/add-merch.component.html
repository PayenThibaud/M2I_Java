<form [formGroup]="merchForm" (ngSubmit)="handleSubmit()" class="space-y-4">
  <div>
    <label for="name" class="block text-slate-700 font-medium mb-1"
      >Nom du produit</label
    >
    <input
      type="text"
      id="name"
      formControlName="name"
      class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-slate-500"
    />
  </div>
  <div>
    <label for="price" class="block text-slate-700 font-medium mb-1"
      >Prix du produit</label
    >
    <input
      type="text"
      id="price"
      formControlName="price"
      class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-slate-500"
    />
  </div>
  <div>
    <label for="description" class="block text-slate-700 font-medium mb-1"
      >Déscription du produit</label
    >
    <textarea
      id="description"
      formControlName="description"
      class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-slate-500"
    ></textarea>
  </div>
  <div>
    <label for="stock" class="block text-slate-700 font-medium mb-1"
      >Stock du produit</label
    >
    <input
      type="number"
      id="stock"
      formControlName="stock"
      class="w-full border border-slate-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-slate-500"
    />
  </div>
  <button
    class="bg-slate-800 text-white rounded-lg py-2 px-4 hover:bg-slate-700"
  >
    Enregistrer
  </button>
</form>
