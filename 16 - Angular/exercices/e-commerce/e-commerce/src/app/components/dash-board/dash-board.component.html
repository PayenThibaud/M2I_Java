<table class="min-w-full bg-white border border-slate-200 rounded-lg shadow-md">
  <thead>
    <tr class="bg-slate-800 text-white">
      <th class="py-3 px-4 text-left">Nom</th>
      <th class="py-3 px-4 text-left">Description</th>
      <th class="py-3 px-4 text-left">Prix</th>
      <th class="py-3 px-4 text-left">Stock</th>
      <th class="py-3 px-4 text-left">Action</th>
    </tr>
  </thead>
  <tbody>
    @for (m of merchList; track m) {
    <tr class="border-t border-slate-200 hover:bg-slate-100">
      <td class="py-2 px-4">{{ m.name }}</td>
      <td class="py-2 px-4">{{ m.description }}</td>
      <td class="py-2 px-4">{{ m.price }}</td>
      <td class="py-2 px-4">{{ m.stock }}</td>
      <td class="py-2 px-4">
        <button
          (click)="remove(m)"
          class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600"
        >
          Supprimer
        </button>
      </td>
    </tr>
    }
  </tbody>
</table>
