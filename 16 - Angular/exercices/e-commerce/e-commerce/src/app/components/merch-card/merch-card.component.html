<article class="border border-slate-200 rounded-lg p-4 shadow-md">
  <div class="text-center mb-4">
    <h3 class="text-xl font-semibold text-slate-800">{{ merch.name }}</h3>
    <p class="text-slate-600">{{ merch.description }}</p>
    <p class="text-lg font-bold text-slate-700">{{ merch.price }}€</p>
    <p class="text-sm text-gray-500">Stock: {{ merch.stock }}</p>
  </div>
  <div class="text-center">
    <button
      [disabled]="merch.stock <= 0"
      (click)="addToCart()"
      class="bg-slate-800 text-white rounded-lg px-4 py-2 hover:bg-slate-700 disabled:bg-gray-300"
    >
      Ajouter au panier
    </button>
  </div>
</article>
